name: Verify Knowledge System

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run catalog:build
      - run: npm run docs:sync
      - run: npm run docs:render
      - run: npm test
      - run: npm run verify
      - run: git diff --exit-code
      - run: test -z "$(git status --porcelain --untracked-files=all)"
